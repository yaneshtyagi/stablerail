name: stablerail

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: stablerail
      POSTGRES_PASSWORD: stablerail
      POSTGRES_DB: stablerail
    ports:
      - "54329:5432"
    volumes:
      - stablerail-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stablerail -d stablerail"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.10.3
    ports:
      - "63799:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  queue:
    image: softwaremill/elasticmq-native:1.7.1
    ports:
      - "9324:9324"
      - "9325:9325"
    volumes:
      - ./config/elasticmq.conf:/opt/elasticmq.conf:ro

volumes:
  stablerail-postgres:
