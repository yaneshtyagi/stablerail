include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

generate-node-address = false

aws {
  region = us-east-1
  accountId = 000000000000
}

queues {
  stablerail-control-plane {
    defaultVisibilityTimeout = 30 seconds
    delay = 0 seconds
    receiveMessageWait = 20 seconds
    fifo = false
    deadLettersQueue {
      name = "stablerail-control-plane-dlq"
      maxReceiveCount = 5
    }
  }
  stablerail-control-plane-dlq {
    defaultVisibilityTimeout = 30 seconds
    fifo = false
  }
}
